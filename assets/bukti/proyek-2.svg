<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Pratinjau visualisasi data kinerja pelayanan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf9f6"/>
      <stop offset="1" stop-color="#f7e7dd"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3a077"/>
      <stop offset="1" stop-color="#c2643c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="180" cy="800" r="240" fill="#ffffff" opacity="0.45"/>

  <g>
    <rect x="270" y="150" width="1060" height="600" rx="26" fill="#ffffff" stroke="#f0dbd0" stroke-width="4"/>
    <rect x="312" y="196" width="210" height="18" rx="9" fill="#e8bca4"/>
    <rect x="1130" y="188" width="152" height="34" rx="17" fill="#fdf1e9"/>

    <!-- grid -->
    <g stroke="#f6e6dc" stroke-width="3">
      <line x1="360" y1="300" x2="1260" y2="300"/>
      <line x1="360" y1="380" x2="1260" y2="380"/>
      <line x1="360" y1="460" x2="1260" y2="460"/>
      <line x1="360" y1="540" x2="1260" y2="540"/>
    </g>
    <line x1="360" y1="620" x2="1260" y2="620" stroke="#eccbb8" stroke-width="4"/>

    <!-- bars -->
    <g fill="url(#bar)">
      <rect x="392" y="470" width="62" height="150" rx="10"/>
      <rect x="500" y="400" width="62" height="220" rx="10"/>
      <rect x="608" y="510" width="62" height="110" rx="10"/>
      <rect x="716" y="340" width="62" height="280" rx="10"/>
      <rect x="824" y="430" width="62" height="190" rx="10"/>
      <rect x="932" y="300" width="62" height="320" rx="10"/>
      <rect x="1040" y="380" width="62" height="240" rx="10"/>
      <rect x="1148" y="450" width="62" height="170" rx="10"/>
    </g>

    <!-- trend line -->
    <polyline points="423,440 531,368 639,478 747,308 855,398 963,268 1071,348 1179,418"
      fill="none" stroke="#7a3a20" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

    <!-- legend -->
    <circle cx="392" cy="680" r="9" fill="#c2643c"/>
    <rect x="414" y="672" width="120" height="14" rx="7" fill="#f3ddcf"/>
    <circle cx="576" cy="680" r="9" fill="#7a3a20" opacity="0.55"/>
    <rect x="598" y="672" width="150" height="14" rx="7" fill="#f3ddcf"/>
  </g>
</svg>
